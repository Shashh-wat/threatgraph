services:
  neo4j:
    image: neo4j:5.24-community
    container_name: threatgraph-neo4j
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt driver
    environment:
      - NEO4J_AUTH=neo4j/threatgraph123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=256m
      - NEO4J_server_memory_pagecache_size=128m
    mem_limit: 550m
    volumes:
      - ./neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p threatgraph123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
